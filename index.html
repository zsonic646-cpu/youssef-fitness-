<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090711">
<meta name="description" content="YOUSSEF FITNESS - خطتك المنزلية للياقة والقوة العامة">
<title>YOUSSEF FITNESS | Fitness System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#090711;--surface:#12101c;--surface2:#191426;--surface3:#211832;
 --purple:#9b6dff;--purple2:#7441db;--light:#d7c3ff;
 --text:#f6f2ff;--muted:#aaa1bd;--border:#302640;
 --green:#75d9ad;--red:#ff8296;--radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",Tahoma,Arial,sans-serif;font-size:14px;line-height:1.8}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--light);outline-offset:3px}
a{color:var(--light)}
svg{display:block;flex-shrink:0}
button svg{width:19px;height:19px}
.shell{max-width:1120px;margin:auto;padding:0 18px 100px}
header{max-width:1120px;margin:auto;padding:22px 18px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#b18aff,#6333c9);box-shadow:0 8px 30px #7c3aed33;color:white}
.brand-mark svg{width:28px;height:28px}
.brand h1{font-size:17px;line-height:1.5;letter-spacing:.4px;font-weight:900;margin:0}
.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}
.header-status{font-size:11px;color:var(--green);display:flex;align-items:center;gap:6px}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.hero{position:relative;overflow:hidden;padding:28px;border-radius:25px;border:1px solid #4a346a;background:linear-gradient(115deg,#25153e,#15101f 68%,#211232)}
.hero:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;border:1px solid #a779ff20;left:-90px;top:-120px;box-shadow:0 0 0 30px #a779ff08,0 0 0 60px #a779ff05}
.eyebrow{font-size:11px;letter-spacing:1.8px;color:var(--light);font-weight:800}
.hero h2{font-size:clamp(24px,4vw,37px);line-height:1.5;margin:12px 0 8px;font-weight:900;max-width:650px}
.hero p{color:#c0b4d4;max-width:600px;font-size:13px;margin:0 0 20px}
.hero-content{position:relative;z-index:1}
.hero-bottom{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.primary,.secondary,.danger,.icon-button{border:1px solid transparent;border-radius:12px;padding:10px 15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;transition:transform .15s,border-color .15s}
.primary{background:linear-gradient(135deg,#a77aff,#7138d5);color:#fff;box-shadow:0 6px 18px #7138d526}
.secondary{background:var(--surface3);border-color:var(--border);color:var(--text)}
.danger{background:#361c2a;color:#ffb5c0;border-color:#673047}
.primary:hover,.secondary:hover,.danger:hover{transform:translateY(-1px)}
.small{padding:7px 10px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 18px}
.stat{border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:16px;min-width:0}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:5px}
.stat-icon{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:#2b1d42;color:var(--light)}
.stat-icon svg{width:19px;height:19px}
.stat strong{display:block;font-size:25px;font-weight:900;line-height:1.5;margin-top:7px}
.stat span{color:var(--muted);font-size:11px}
.nav{display:flex;gap:8px;overflow-x:auto;padding:7px 0 15px;position:sticky;top:0;z-index:10;background:#090711f5;scrollbar-width:thin}
.nav button{flex-shrink:0;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 13px;color:var(--muted);font-size:12px;font-weight:700}
.nav button.active{background:#332148;border-color:#8356c4;color:#fff}
.nav svg{width:17px;height:17px}
.section{display:none}
.section.active{display:block;animation:appear .22s ease}
@keyframes appear{from{opacity:.45;transform:translateY(4px)}to{opacity:1;transform:none}}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}
.section-heading h2{margin:0;font-size:21px;font-weight:900}
.section-heading p{margin:3px 0 0;color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px}
.card h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted);font-size:12px;line-height:2}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}
label{font-size:12px;color:#d5c9e8;font-weight:700}
input,select,textarea{width:100%;background:#0c0a14;border:1px solid var(--border);border-radius:11px;padding:11px 12px;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
textarea{resize:vertical;min-height:100px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
